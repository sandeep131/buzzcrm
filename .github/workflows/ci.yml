name: CI

# Makes AGENTS.md "CI must pass before merge" enforceable rather than
# aspirational. Runs on PRs (the gate) and on main (catches anything that
# reached main another way).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # A real Postgres, not SQLite. The schema depends on Postgres-specific
      # features the suite actually asserts on: partial unique indexes and
      # DEFERRABLE INITIALLY DEFERRED foreign keys. Anything less would pass
      # while testing something other than what production runs.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buzzcrm
          POSTGRES_PASSWORD: buzzcrm
          POSTGRES_DB: buzzcrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buzzcrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Overrides the tests/conftest.py default, which points at this box's
      # native Postgres on 5433. conftest uses os.environ.setdefault, so an
      # environment variable set here wins.
      DATABASE_URL: postgresql+psycopg://buzzcrm:buzzcrm@localhost:5432/buzzcrm_test
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # requires-python = ">=3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migrations apply to an empty database
        run: alembic upgrade head

      - name: Migrations are reversible (AGENTS.md rule 4)
        # Asserted here as well as in the suite. This is the direction that
        # breaks — tenants and users reference each other, so the downgrade
        # must drop the foreign keys before the tables.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -q

      - name: App boots and /health responds
        # A green suite does not prove the app starts — issue #1's whole
        # lesson was that written and verified are different states.
        run: |
          uvicorn src.main:app --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health && break || sleep 1
          done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
